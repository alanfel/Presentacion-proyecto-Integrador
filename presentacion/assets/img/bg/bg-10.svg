<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03070e"/>
    <stop offset="0.55" stop-color="#071426"/>
    <stop offset="1" stop-color="#0b1d33"/>
  </linearGradient>
